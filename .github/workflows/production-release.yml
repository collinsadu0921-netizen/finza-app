            }
            appendFileSync(process.env.GITHUB_ENV, keys.map((name) => name + "=" + values[name]).join("\n") + "\n");
            console.log("Production public Supabase build configuration loaded.");
          }
          main().catch(() => {
            console.error("Unable to load validated Production public Supabase build configuration.");
            process.exitCode = 1;
          });
          NODE

      - name: Production build
        run: npm run build

      - name: Diagnose production env pull
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release-production.mjs --preflight --expected-sha ${{ github.sha }}
